<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Daniel Arevalo</title>
    <link rel="icon" type="image/svg+xml" href="favicon/ÆSquare.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/ÆSquare-32.png">
    <link rel="apple-touch-icon" href="favicon/ÆSquare-ios.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --vellum-base: #f4f1ea;
            --vellum-highlight: #ffffff;
            --ink-deep: #1a1c1e;
            --ink-faded: #4a4d52;
            --etched-line: rgba(26, 28, 30, 0.15);
            --hazard-amber: #d4a017;
            --grain-opacity: 0.06;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--vellum-base);
            color: var(--ink-deep);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            line-height: 1.6;
        }

        .vellum-texture {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: var(--grain-opacity);
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: multiply;
        }

        .topography-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.18;
            background-image: url("data:image/svg+xml,%3Csvg width='1200' height='1200' viewBox='0 0 1200 1200' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='diagonalGrid' width='150' height='150' patternUnits='userSpaceOnUse'%3E%3Cpath d='M0 0 L150 150' stroke='%231a1c1e' stroke-width='0.5' fill='none'/%3E%3Cpath d='M150 0 L0 150' stroke='%231a1c1e' stroke-width='0.5' fill='none'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='100%25' height='100%25' fill='url(%23diagonalGrid)'/%3E%3C/svg%3E");
            background-size: 300px 300px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
            position: relative;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--ink-faded);
            text-decoration: none;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--ink-deep);
        }

        .back-link::before {
            content: '◀';
            font-size: 0.6rem;
        }

        .projects-card {
            background: linear-gradient(135deg, var(--vellum-highlight) 0%, var(--vellum-base) 100%);
            border: 1px solid var(--etched-line);
        }

        .top-border {
            height: 3px;
            background: var(--ink-deep);
        }

        .page-header {
            padding: 3rem;
            border-bottom: 1px solid var(--etched-line);
        }

        .page-header h1 {
            font-size: clamp(2rem, 5vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.75rem;
        }

        .mono {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--hazard-amber);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .page-body {
            padding: 3rem;
            min-height: 240px;
        }

        .page-body p {
            color: var(--ink-faded);
            font-size: 1.1rem;
            max-width: 36ch;
        }
    </style>
</head>
<body>
    <div class="vellum-texture"></div>
    <div class="topography-bg"></div>

    <div class="container">
        <a href="index.html" class="back-link">Back to Portfolio</a>

        <div class="projects-card">
            <div class="top-border"></div>
            <header class="page-header">
                <p class="mono">Selected Work</p>
                <h1>Projects</h1>
            </header>
            <div class="page-body">
                <p>Case studies and build logs will live here soon.</p>
            </div>
        </div>
    </div>
</body>
</html>
