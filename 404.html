<head>

    <style>
        :root {
            --vellum-base: #f4f1ea;
            --ink-deep: #1a1c1e;
            --ink-faded: #4a4d52;
            --etched-line: rgba(26, 28, 30, 0.15);
            --hazard-amber: #d4a017;
            --hazard-amber-text: #85620a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--vellum-base);
            color: var(--ink-deep);
            font-family: 'Outfit', sans-serif;
            line-height: 1.6;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
        }

        .vellum-texture {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            opacity: 0.06;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: multiply;
        }

        .topbar,
        main {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding-inline: 1.5rem;
        }

        .topbar {
            padding-block: 2rem;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-block: 2rem 6rem;
        }

        .mono {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-faded);
        }

        .error-code {
            border-left: 2px solid var(--hazard-amber);
            padding-left: 0.75rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        p.lede {
            font-size: 1.15rem;
            font-weight: 300;
            color: var(--ink-faded);
            max-width: 34rem;
            margin-bottom: 2.5rem;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 2rem;
            border-top: 0.5px dashed var(--etched-line);
            padding-top: 1.5rem;
        }

        .links a {
            color: var(--ink-deep);
            text-decoration: none;
            font-weight: 600;
        }

        .links a:hover,
        .links a:focus-visible {
            color: var(--hazard-amber-text);
        }
    </style>
</head>
<body>
    <div class="vellum-texture"></div>

        <h1>Page not found</h1>

            <a href="/resume.html">Resume →</a>
            <a href="/projects.html">Projects →</a>
        </nav>
